name: Release

on:
  push:
    tags:
      - "bootstrap-*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview
      - name: Restore
        run: dotnet restore Wisp.slnx
      - name: Build
        run: dotnet build Wisp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Wisp.slnx -c Release --no-build
      - name: Pack CLI and SDK
        run: |
          mkdir -p artifacts/nuget artifacts/tools
          dotnet pack src/Wisp.Cli/Wisp.Cli.fsproj -c Release -o artifacts/nuget
          dotnet pack sdk/Wisp.Sdk/Wisp.Sdk.csproj -c Release -o artifacts/nuget
      - name: Install CLI tool
        run: dotnet tool install --tool-path artifacts/tools --add-source artifacts/nuget Wisp.Cli --version 0.1.5-bootstrap
      - name: Verify project runner
        run: artifacts/tools/wisp run samples/projects/app/app.wisp.proj
      - name: Verify MSBuild SDK
        run: bash eng/test-sdk.sh
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name github \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text
          dotnet nuget push "artifacts/nuget/*.nupkg" \
            --source github \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Wisp ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/nuget/*.nupkg
